# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Configuration
spring.application.name=hostel-management-backend
spring.main.banner-mode=off

# CORS Configuration
cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500

# Firebase Configuration
firebase.project.id=convergence-5962c
firebase.config.path=classpath:serviceAccountKey.json

# Logging Level
logging.level.root=INFO
logging.level.com.hostelmanagement=DEBUG
logging.level.org.springframework.web=INFO
