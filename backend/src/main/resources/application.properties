# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Configuration
spring.application.name=hostel-management-backend
spring.main.banner-mode=off

# CORS Configuration
# Comma-separated list of allowed frontend origins. Override in production via
# the CORS_ALLOWED_ORIGINS environment variable (e.g. your Vercel domain).
cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500

# Error Handling Hardening
# Never leak internal exception details, messages, binding errors or stack
# traces to API clients. All errors are normalised by GlobalExceptionHandler.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Firebase Configuration
firebase.project.id=convergence-5962c
firebase.config.path=classpath:serviceAccountKey.json

# Logging Level
logging.level.root=INFO
logging.level.com.hostelmanagement=DEBUG
logging.level.org.springframework.web=INFO
